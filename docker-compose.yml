# Local development dependencies (OPS-08). Ports are bound to 127.0.0.1 only.
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/authn
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # development only
      POSTGRES_DB: authn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authn"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    environment:
      # Offer STARTTLS with a self-signed certificate (NTF-03 requires TLS).
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

volumes:
  pgdata: {}
