# Quality gates (TST-07). A red job blocks the merge.
#
# Supply chain: every action is pinned to a full commit SHA (a moved or
# compromised tag cannot change what runs); the comment names the release
# the SHA was resolved from (`git ls-remote`, annotated tags dereferenced).
# Bump SHA and comment together.
name: ci

on:
  push:
    # Development branches are verified on every push too, so work is checked
    # before a pull request exists.
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/authn

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (default features off)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d authn"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Broken intra-doc links and malformed rustdoc fail the build.
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  requirement-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every requirement id of docs/spec/requirements.md is named by a test
      # (allow-list with reasons: scripts/requirement-coverage-allowlist.txt).
      - run: scripts/check-requirement-coverage.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      # LIC-01 licences, RustSec advisories, bans, sources.
      - run: cargo deny check
      # Development-only fuzz harness (libfuzzer-sys NCSA exception, fuzz/deny.toml).
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses sources

  licence-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
      - run: cargo install cargo-about --version 0.9.3 --features cli --locked
      # --frozen = offline + locked: the texts come only from the crate packages.
      - run: cargo fetch --locked
      # THIRD_PARTY_LICENSES.txt ships with the binary (Docker image); it must
      # match the current dependency graph exactly (LIC-01).
      - run: python3 -I licenses/generate_notices.py
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.txt
      # The fuzz harness notices must stay next to the harness.
      - run: test -s fuzz/THIRD_PARTY_LICENSES.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
      - run: cargo install cargo-audit --locked
      # Ignored advisories (with justification) live in .cargo/audit.toml / deny.toml.
      - run: cargo audit

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d authn"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (the action has no release tags)
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly branch (the action has no release tags)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - working-directory: fuzz
        run: cargo +nightly fuzz build -O
