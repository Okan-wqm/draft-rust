# Quality gates (TST-07). A red job blocks the merge.
name: ci

on:
  push:
    # Development branches are verified on every push too, so work is checked
    # before a pull request exists.
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/authn

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (default features off)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d authn"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # LIC-01 licences, RustSec advisories, bans, sources.
      - run: cargo deny check
      # Development-only fuzz harness (libfuzzer-sys NCSA exception, fuzz/deny.toml).
      - run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses sources

  licence-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - run: cargo install cargo-about --version 0.9.3 --features cli --locked
      # --frozen = offline + locked: the texts come only from the crate packages.
      - run: cargo fetch --locked
      # THIRD_PARTY_LICENSES.txt ships with the binary (Docker image); it must
      # match the current dependency graph exactly (LIC-01).
      - run: python3 -I licenses/generate_notices.py
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.txt
      # The fuzz harness notices must stay next to the harness.
      - run: test -s fuzz/THIRD_PARTY_LICENSES.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - run: cargo install cargo-audit --locked
      # Ignored advisories (with justification) live in .cargo/audit.toml / deny.toml.
      - run: cargo audit

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d authn"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - working-directory: fuzz
        run: cargo +nightly fuzz build -O
