[package]
name = "authn-server"
description = "The rust-authentication binary: configuration, wiring, HTTP server, background jobs and operational CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "rust-authentication"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["passkey", "sms", "oidc-provider"]
# ARC-11 feature flags, forwarded to the owning crates.
passkey = ["authn-webauthn/passkey", "authn-session/passkey", "authn-admin/passkey"]
sms = ["authn-mfa/sms", "authn-notify/sms"]
redis = ["authn-protect/redis"]
# K-80 OAuth 2.1 / OpenID Connect provider (OIDP-*). Compiled by default;
# the endpoints are mounted only with `oidc_provider.enabled = true`.
oidc-provider = ["dep:authn-oidc-provider"]
# K-92 OpenTelemetry tracing (OTLP over HTTP/protobuf). Off by default; a
# configuration with `telemetry.enabled = true` is refused without it.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
    "dep:bytes",
    "dep:getrandom",
]

[dependencies]
authn-core.workspace = true
authn-crypto.workspace = true
authn-store.workspace = true
authn-password.workspace = true
authn-account.workspace = true
authn-mfa.workspace = true
authn-webauthn.workspace = true
authn-org.workspace = true
authn-protect.workspace = true
authn-audit.workspace = true
authn-notify.workspace = true
authn-session.workspace = true
authn-oidc-client.workspace = true
authn-admin.workspace = true
authn-oidc-provider = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
time.workspace = true
uuid.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
figment.workspace = true
secrecy.workspace = true
rustls.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
url.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
authn-testkit.workspace = true
serde_urlencoded.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true
futures.workspace = true
url.workspace = true
webauthn-authenticator-rs.workspace = true
webauthn-rs-proto.workspace = true
openidconnect.workspace = true
base64.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }

# Real passkey ceremonies with the software authenticator.
[[test]]
name = "passkey_e2e"
required-features = ["passkey"]

# K-92: spans exported through the OpenTelemetry layer.
[[test]]
name = "telemetry"
required-features = ["otel"]

# Admin sessions need passkey MFA (ADM-01).
[[test]]
name = "admin_e2e"
required-features = ["passkey"]

# OAuth 2.1 / OIDC provider through the stack (K-80); staff roles need
# passkey logins.
[[test]]
name = "oidc_provider_e2e"
required-features = ["oidc-provider", "passkey"]

# Passkey enrollment inside the login challenge (K-112).
[[test]]
name = "login_passkey_enrollment"
required-features = ["passkey"]

# K-70 hot-path latency benchmarks (`cargo bench -p authn-server`). With
# `test = true` a plain `cargo test` also runs the target, without
# `--bench`: every case then runs twice as a functional smoke test (CI).
[[bench]]
name = "hot_paths"
harness = false
test = true
