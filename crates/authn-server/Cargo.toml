[package]
name = "authn-server"
description = "The rust-authentication binary: configuration, wiring, HTTP server, background jobs and operational CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "rust-authentication"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["passkey", "sms"]
# ARC-11 feature flags, forwarded to the owning crates.
passkey = ["authn-webauthn/passkey", "authn-session/passkey"]
sms = ["authn-mfa/sms", "authn-notify/sms"]
redis = ["authn-protect/redis"]

[dependencies]
authn-core.workspace = true
authn-crypto.workspace = true
authn-store.workspace = true
authn-password.workspace = true
authn-account.workspace = true
authn-mfa.workspace = true
authn-webauthn.workspace = true
authn-org.workspace = true
authn-protect.workspace = true
authn-audit.workspace = true
authn-notify.workspace = true
authn-session.workspace = true
authn-oidc-client.workspace = true
authn-admin.workspace = true
async-trait.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
time.workspace = true
uuid.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
clap.workspace = true
figment.workspace = true
secrecy.workspace = true
rustls.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
authn-testkit.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true
futures.workspace = true
url.workspace = true
webauthn-authenticator-rs.workspace = true
webauthn-rs-proto.workspace = true

# Real passkey ceremonies with the software authenticator.
[[test]]
name = "passkey_e2e"
required-features = ["passkey"]
