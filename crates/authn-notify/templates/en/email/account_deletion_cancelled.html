{% extends "en/email/layout.html" %}
{% block content %}
<p style="margin:0 0 16px;">The deletion of your {{ app_name }} account was cancelled. Your account stays active.</p>
{% endblock %}
{% block details %}
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 16px;font-size:14px;">
<tr><td style="padding:2px 12px 2px 0;color:#52606d;vertical-align:top;">Time</td><td style="padding:2px 0;">{{ at }}</td></tr>
</table>
{% endblock %}
{% block closing %}
<p style="margin:0 0 16px;">If you did not cancel it yourself, contact support.</p>
{% endblock %}
