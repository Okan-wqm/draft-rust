[package]
name = "authn-notify"
description = "Notification rendering (TR/EN templates), email transports and SMS senders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
default = ["sms"]
# HTTP SMS provider (NTF-04). Without it `provider = "http"` is refused at
# startup and SMS behaves as unavailable (ARC-11).
sms = []

[dependencies]
authn-core.workspace = true
authn-crypto.workspace = true
authn-store.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true
sqlx.workspace = true
tokio.workspace = true
zeroize.workspace = true
lettre.workspace = true
# `fuel` bounds the work an (operator-supplied) template may do per render.
minijinja = { workspace = true, features = ["fuel"] }
url.workspace = true
http.workspace = true
metrics.workspace = true

[dev-dependencies]
authn-testkit.workspace = true
tokio.workspace = true
serde_json.workspace = true
proptest.workspace = true
tempfile.workspace = true
# Local TLS SMTP test server (ring provider only, as everywhere else).
rustls.workspace = true
