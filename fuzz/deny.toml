# Licence policy for the development-only fuzz harness: the workspace policy
# (../deny.toml) plus NCSA for libfuzzer-sys only.
#
# NCSA exception: approved by the project owner (2026-11-04).
# NCSA (University of Illinois/NCSA Open Source License) is a permissive,
# BSD-style licence: commercial use, modification and redistribution are
# permitted; the only obligation is to retain the copyright notice, licence
# text and disclaimer when the code is redistributed. Commercial use stays
# unrestricted because:
#   - the exception is limited to the single crate `libfuzzer-sys` (no other
#     crate may use NCSA);
#   - this package is `publish = false` and its fuzz binaries are never
#     distributed;
#   - the product workspace (../deny.toml) explicitly bans `libfuzzer-sys`, so
#     it can never be linked into the shipped `rust-authentication` binary.
# If fuzz binaries are ever redistributed, ship libfuzzer-sys's licence and
# copyright notices with them.
[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "see ../deny.toml" },
    { id = "RUSTSEC-2026-0387", reason = "see ../deny.toml" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
    "CDLA-Permissive-2.0", "0BSD",
]
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    { crate = "webauthn-rs", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-core", allow = ["MPL-2.0"] },
    { crate = "webauthn-rs-proto", allow = ["MPL-2.0"] },
    { crate = "webauthn-attestation-ca", allow = ["MPL-2.0"] },
    { crate = "base64urlsafedata", allow = ["MPL-2.0"] },
    { crate = "crypto-glue", allow = ["MPL-2.0"] },
    { crate = "compact_jwt", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
