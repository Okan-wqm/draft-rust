# cargo-fuzz harness (TST-04). Nightly only:
#   cargo +nightly fuzz build
#   cargo +nightly fuzz run email_normalize
#
# Separate workspace on purpose: libfuzzer-sys is licensed
# "(MIT OR Apache-2.0) AND NCSA". NCSA is permissive but not on the LIC-01
# list, so it is confined to this development-only package (never linked
# into the shipped binary) and allowed by fuzz/deny.toml for that crate only.
#
# Ownership: each fuzz_targets/<target>.rs file belongs to the crate named in
# its header; this Cargo.toml already depends on every crate that owns a
# target, so module agents only edit their own target file.

[package]
name = "authn-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
http = "1.5.0"
authn-core = { path = "../crates/authn-core" }
authn-crypto = { path = "../crates/authn-crypto" }
authn-org = { path = "../crates/authn-org" }
authn-protect = { path = "../crates/authn-protect" }
authn-audit = { path = "../crates/authn-audit" }
authn-password = { path = "../crates/authn-password" }
authn-mfa = { path = "../crates/authn-mfa" }
authn-webauthn = { path = "../crates/authn-webauthn" }
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals", "resident-key-support"] }
# Harness helpers for the authn-crypto targets (same versions as the workspace).
base64 = "0.23.1"
serde_json = "1.0.154"
time = "0.3.55"

[profile.release]
debug = 1

[[bin]]
name = "email_normalize"
path = "fuzz_targets/email_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_ip"
path = "fuzz_targets/client_ip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_parse"
path = "fuzz_targets/jwt_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_key_parse"
path = "fuzz_targets/api_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webhook_signature"
path = "fuzz_targets/webhook_signature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "return_to"
path = "fuzz_targets/return_to.rs"
test = false
doc = false
bench = false

